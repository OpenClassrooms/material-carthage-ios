name: Unit test
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Check unit test
    timeout-minutes: 30
    runs-on: macos-26
    env:
      SIMULATOR_NAME: "iPhone 17"
      SIMULATOR_OS: "26.5"
      XCODE_VERSION: "26.6"

    steps:
      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Boot simulator
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SIMULATOR_OS//./-}"
          UDID=$(xcrun simctl list devices available --json | jq -r --arg runtime "$RUNTIME" --arg name "$SIMULATOR_NAME" '.devices[$runtime][] | select(.name == $name) | .udid')
          xcrun simctl bootstatus "$UDID" -b

      - name: Run unit test
        run: >
          set -o pipefail &&
          xcodebuild test
          -workspace material-carthage-ios.xcworkspace
          -scheme material-carthage-ios
          -destination "platform=iOS Simulator,name=${SIMULATOR_NAME},OS=${SIMULATOR_OS}"
          2>&1 | tee xcodebuild.log | xcbeautify

      - name: Show raw xcodebuild log on failure
        if: failure()
        run: tail -n 200 xcodebuild.log
